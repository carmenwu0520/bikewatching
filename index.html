<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bikewatching</title>

    <!-- Step 0.5: favicon -->
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

    <!-- Step 1.1: Mapbox 的 CSS -->
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
      rel="stylesheet"
    />

    <!-- Step 0.4 + 1.2: 自己的样式 -->
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="map.css" />

    <!-- Step 1.1: 主程序（type="module" 才能用 import） -->
    <script src="map.js" type="module"></script>
  </head>

  <body>
    <!-- Step 5.1: 标题 + 时间滑块 -->
    <header>
      <h1>🚲 Bikewatching</h1>
      <label>
        Filter by time:
        <input id="time-slider" type="range" min="-1" max="1440" value="-1" />
        <time id="selected-time"></time>
        <em id="any-time">(any time)</em>
      </label>
    </header>

    <!-- Step 1.2 + 3.2: 地图容器，里面放一层 svg 画站点圆圈 -->
    <div id="map">
      <svg></svg>
    </div>

    <!-- Step 6.2: 图例 -->
    <div class="legend">
      <div style="--departure-ratio: 1">More departures</div>
      <div style="--departure-ratio: 0.5">Balanced</div>
      <div style="--departure-ratio: 0">More arrivals</div>
    </div>
  </body>
</html>
